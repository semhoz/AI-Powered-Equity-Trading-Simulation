[project]
name = "autonomous-traders"
version = "1.0.0"
description = "An autonomous equity trading simulation powered by AI agents and MCP (Model Context Protocol) servers"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.22.0",
    "mcp[cli]>=1.5.0",
    "mcp-server-fetch>=2025.1.17",
    "openai>=1.68.2",
    "openai-agents>=0.0.15",
    "plotly>=6.0.1",
    "polygon-api-client>=1.14.5",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
